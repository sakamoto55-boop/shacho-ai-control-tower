name: DIOS PostgreSQL and identity verification
on:
  push:
    branches: [codex/dios-runtime-hardening-20260906]
    paths:
      - 'src/dios/**'
      - 'src/dios-cloud.ts'
      - 'tests/dios/cloud/**'
      - 'migrations/dios/**'
      - 'scripts/dios/**'
      - 'cloudrun/dios/**'
      - '.github/workflows/dios-cloud-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dios-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/dios-runtime-hardening-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dios_test
          POSTGRES_PASSWORD: ci-only-not-real
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d dios_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AI_PROVIDER: mock
      LCC_COMMAND_MODE: demo
      ENABLE_DEV_ENDPOINTS: 'false'
      NODE_ENV: test
      DIOS_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-real@127.0.0.1:5432/dios_test
      DIOS_CLOUD_TEST_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare evidence folder
        run: mkdir -p "$RUNNER_TEMP/dios-cloud-review"
      - name: Apply only hash-verified legacy wiring
        run: node scripts/dios/apply-cloud-wiring.mjs
      - name: Install pinned graph without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compile existing and cloud entrypoints
        id: build
        run: npm run build
      - name: Run all tests including actual PostgreSQL and PowerShell
        id: tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/dios-cloud-review/vitest.json"
      - name: Verify compiled HTTP startup
        id: smoke
        run: npm run test:dios:smoke
      - name: Actual disposable PostgreSQL dump and restore
        id: restore
        env:
          DIOS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/dios/restore-smoke.mjs | tee "$RUNNER_TEMP/dios-cloud-review/restore.json"
      - name: Lint
        id: lint
        run: npm run lint
      - name: Require clean dependency vulnerability audit
        id: audit
        run: npm audit --audit-level=moderate --json > "$RUNNER_TEMP/dios-cloud-review/dependency-audit.json"
      - name: Build rootless cloud container
        id: container
        run: docker build --file cloudrun/dios/Dockerfile --tag dios-cloud-test:${{ github.sha }} .
      - name: Confirm container refuses unconfigured startup
        run: |
          set +e
          docker run --rm dios-cloud-test:${{ github.sha }} > "$RUNNER_TEMP/dios-cloud-review/unconfigured-startup.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q DIOS_CLOUD_STARTUP_REJECTED "$RUNNER_TEMP/dios-cloud-review/unconfigured-startup.log"
      - name: Commit verified wiring on isolated branch only
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=codex/dios-runtime-hardening-20260906
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          node scripts/dios/apply-cloud-wiring.mjs --list > "$RUNNER_TEMP/allowed-paths.txt"
          while IFS= read -r path; do grep -Fxq "$path" "$RUNNER_TEMP/allowed-paths.txt"; done < <(git diff --name-only)
          while IFS= read -r path; do git add -- "$path"; done < "$RUNNER_TEMP/allowed-paths.txt"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(dios): connect verified cloud persistence and server-side identity to existing COMMAND services'
            credential=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
            echo "::add-mask::$credential"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" push origin "HEAD:refs/heads/$branch"
          fi
      - name: Save exact tested source and validation summary
        if: ${{ !cancelled() }}
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          CONTAINER_RESULT: ${{ steps.container.outcome }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/dios-cloud-review/COMMIT.txt"
          git diff > "$RUNNER_TEMP/dios-cloud-review/uncommitted-candidate.diff"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/dios-cloud-review/source.tar.gz"
          printf 'Tests: %s\nBuild: %s\nRestore: %s\nDependency audit: %s\nContainer: %s\nProduction deployment: NOT RUN\n' "$TEST_RESULT" "$BUILD_RESULT" "$RESTORE_RESULT" "$AUDIT_RESULT" "$CONTAINER_RESULT" | tee "$RUNNER_TEMP/dios-cloud-review/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source and evidence (no database dumps or live secrets)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dios-cloud-review
          path: ${{ runner.temp }}/dios-cloud-review/
          retention-days: 7
