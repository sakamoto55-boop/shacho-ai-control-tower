name: DIOS verification

on:
  push:
    branches: [codex/dios-runtime-hardening-20260906]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: mock
      LCC_COMMAND_MODE: demo
      ENABLE_DEV_ENDPOINTS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      - name: Run baseline tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Compile TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Bundle exact source for offline verification
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/dios-review"
          git rev-parse HEAD > "$RUNNER_TEMP/dios-review/COMMIT.txt"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/dios-review/source.tar.gz"
      - name: Store source artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dios-reviewed-source
          path: ${{ runner.temp }}/dios-review/
          retention-days: 7
      - name: Bundle dependencies for isolated offline verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tar -czf "$RUNNER_TEMP/dios-node-modules.tar.gz" node_modules
      - name: Store dependencies artifact
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dios-offline-dependencies
          path: ${{ runner.temp }}/dios-node-modules.tar.gz
          retention-days: 1
